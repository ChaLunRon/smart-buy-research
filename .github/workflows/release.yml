name: release

# 打 tag 时自动建 Release，并把「可安装的 zip」作为资产上传。
#
# 为什么单开一个工作流：本工作流需要 `contents: write`，而 validate.yml 只需要读权限。
# 分开就能把写权限限制在真正需要的这一条路径上，不放大例行检查的权限。
#
# zip 不是手工打的，而是用 `git archive` 从 tag 现算 —— 这样发布物**可由 tag 重现**：
# 任何人执行 `git archive --prefix=<name>/ <tag>` 都能得到**逐文件内容相同**的包。
# 注意口径：能承诺的是「逐文件相同」（Git 对象指纹一致），**不是「逐字节相同」** ——
# zip 的条目时间戳取构建机器的本机时间，同一 tag 在 UTC 与 GMT+8 打出的容器字节会差
# 条目数 × 2 处（local header 与 central directory 各一处）。所以下面的断言打在内容层。
# 仓库内 44 个文件全部是 LF，`.gitattributes` 也显式声明了 `eol=lf`，
# 所以 `git archive` 不会改动行尾。
#
# zip 的顶层目录名取该 tag 的 `SKILL.md` 里的 `name`。这点是关键：
# GitHub 为 tag 自动生成的 "Source code" 归档，顶层目录是 `{仓库名}-{tag}`（**点号**，
# 如 `smart-buy-research-5.10`），而技能规范要求 `name` 与目录名一致且**点号非法**
# （必须写成 `smart-buy-research-5-10`）。直接下载自动归档再改名容易漏，
# 所以这里附一个解压即可用的 zip。

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      backfill:
        description: "填 all 才会执行：为全部历史 tag 补建 Release"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 建 Release 并附 zip
    runs-on: ubuntu-22.04
    steps:
      # 钉到**完整 SHA**（= v7.0.1），维护方式有两层：
      #   1) 本工作流下一步要执行 `git fetch origin main`，依赖的正是检出动作
      #      持久化的凭据。v6 把凭据从 `.git/config` 改存到 `$RUNNER_TEMP` 下的单独文件，
      #      上游 README 对此明写 **No workflow changes required —
      #      `git fetch`, `git push`, etc. continue to work automatically**；
      #      2026-10-09 又用一个非版本号 tag 把整条发布链路跑通实测过（发布记录 §7.3）。
      #      v7 的变更是「默认拒绝在 `pull_request_target` / `workflow_run` 下检出 fork
      #      代码」（本工作流不用这两个触发器）、迁 ESM、依赖更新 —— 均不影响本路径。
      #   2) SHA 钉死之后**不会自己更新**，所以 `.github/dependabot.yml` 必须同时存在 ——
      #      它认得 SHA 形式，提 PR 时会把 SHA 与下面这行注释里的版本号一起改掉。
      #      只钉 SHA 而不配 dependabot，等于把「懒得更新」升级成「永远不更新」。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 回填要能枚举全部 tag；同时要能读到 main 上的 CHANGELOG
          fetch-depth: 0

      - name: 确定要发布的 tag
        id: plan
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.backfill }}" != "all" ]; then
              echo "未传 backfill=all，本次不做事。"
              echo "tags=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tags="$(git tag --list | sort -V | tr '\n' ' ')"
            echo "回填模式，共 $(git tag --list | wc -l) 个 tag"
          else
            tags="${{ github.ref_name }}"
            echo "tag 推送模式：$tags"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: 落一个 zip 自检脚本
        run: |
          cat > /tmp/check_zip.py <<'PY'
          """把 zip 与 tag 逐文件对齐，防止「发布物与该 tag 不一致」。

          比对的指纹是 Git 对象指纹 sha1("blob <len>\\0" + data)，因此与平台无关。
          这一条能挡住行尾转换之类的静默漂移：曾经 `.editorconfig` / `.gitattributes` /
          `.gitignore` 只被 `* text=auto` 覆盖、没有显式 `eol`，`git archive` 在 Windows 上
          产出 CRLF、在 Linux 上产出 LF —— 同一个 tag 会打出两个不同的包。
          """
          import hashlib
          import subprocess
          import sys
          import zipfile

          zip_path, name, tag = sys.argv[1], sys.argv[2], sys.argv[3]

          with zipfile.ZipFile(zip_path) as zf:
              entries = {n: zf.read(n) for n in zf.namelist() if not n.endswith("/")}

          tops = {n.split("/")[0] for n in entries}
          assert tops == {name}, "zip 顶层目录不唯一：%s" % sorted(tops)
          assert name + "/SKILL.md" in entries, "zip 里找不到 %s/SKILL.md" % name
          assert not any(".git/" in n for n in entries), "zip 里混进了 .git"
          assert not any("__pycache__" in n for n in entries), "zip 里混进了缓存"

          def blob_sha(data):
              return hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()

          tree = subprocess.run(["git", "ls-tree", "-r", "--full-tree", tag],
                                capture_output=True, text=True, check=True).stdout
          expected = {}
          for line in tree.splitlines():
              meta, path = line.split("\t", 1)
              expected[path] = meta.split()[2]

          got = {n.split("/", 1)[1]: blob_sha(d) for n, d in entries.items()}

          missing = sorted(set(expected) ^ set(got))
          assert not missing, "文件集合不一致：%s" % missing[:8]
          bad = sorted(p for p in got if got[p] != expected[p])
          assert not bad, "内容与 tag %s 不一致：%s" % (tag, bad[:8])

          print("zip 自检通过：%d 个条目，顶层 %s，与 tag %s 逐文件一致"
                % (len(entries), name, tag))
          PY

      - name: 逐个建 Release（已存在则跳过）
        if: steps.plan.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # CHANGELOG 统一从默认分支取 —— 它是唯一含全部版本小节的副本：
          # tag 1.0 ~ 4.1 当时还没有 CHANGELOG.md，5.3 / 5.4 的副本又被截断过。
          git fetch --quiet origin main
          git show FETCH_HEAD:CHANGELOG.md > /tmp/CHANGELOG.md

          LATEST="$(git tag --list | sort -V | tail -n1)"
          echo "最新 tag（将标为 Latest）：$LATEST"

          for TAG in ${{ steps.plan.outputs.tags }}; do
            echo "──────── $TAG ────────"

            # tag 名守卫：只允许 `主.次` 形态
            if ! printf '%s' "$TAG" | grep -qE '^[0-9]+\.[0-9]+$'; then
              echo "跳过：不是版本号形态的 tag"
              continue
            fi

            # 幂等：已存在就跳过，重复触发不会报错
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "跳过：Release 已存在"
              continue
            fi

            NAME="$(git show "$TAG:SKILL.md" | sed -n 's/^name:[[:space:]]*//p' | head -n1)"
            if [ -z "$NAME" ]; then
              echo "!! $TAG 的 SKILL.md 里读不到 name" >&2
              exit 1
            fi

            ZIP="/tmp/$NAME.zip"
            git archive --format=zip --prefix="$NAME/" -o "$ZIP" "$TAG"
            python3 /tmp/check_zip.py "$ZIP" "$NAME" "$TAG"

            # CHANGELOG 小节映射：早期版本没有同名小节
            case "$TAG" in
              1.0) SEC="v1" ;;
              2.0) SEC="v2" ;;
              3.0) SEC="v3" ;;
              4.*) SEC="v4" ;;
              5.0) SEC="v5" ;;
              *)   SEC="$TAG" ;;
            esac

            awk -v want="## $SEC" '$0 == want { f = 1; next } f && /^## / { exit } f' \
              /tmp/CHANGELOG.md > /tmp/section.md

            {
              printf '> 下载下面的 `%s.zip`，解压后把整个目录放进运行时的技能目录。\n' "$NAME"
              printf '> **目录名必须保持 `%s`**（= `SKILL.md` 里的 `name` 字段），否则校验不通过。\n\n' "$NAME"

              if [ "$TAG" != "$LATEST" ]; then
                printf '> ⚠️ **历史版本**，能力不完整，正常使用请取最新版 `%s`。\n\n' "$LATEST"
              fi

              if [ -s /tmp/section.md ]; then
                cat /tmp/section.md
              else
                printf '本版本无独立小节，完整记录见 CHANGELOG。\n'
              fi

              printf -- '\n---\n\n完整变更记录见 `CHANGELOG.md` 的「%s」一节：\n' "$SEC"
              printf 'https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY"
            } > /tmp/notes.md

            LATEST_FLAG="--latest=false"
            if [ "$TAG" = "$LATEST" ]; then
              LATEST_FLAG="--latest"
            fi

            gh release create "$TAG" "$ZIP" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              "$LATEST_FLAG"

            echo "已发布 $TAG（资产 $NAME.zip）"
          done

      - name: 汇总线上 Release
        if: steps.plan.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "==== 当前 Release 列表 ===="
          gh release list --limit 50
