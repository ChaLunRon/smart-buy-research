name: validate

# 本工作流只做机器能判定的检查：结构规范、脚本可编译、单元测试。
# 内容层面的纪律（不编造优惠信息、资质必须可溯源等）无法自动化，见 CONTRIBUTING.md。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 本工作流只读：建 Release 需要写权限，单独放在 release.yml 里，
# 这样例行检查不会带着多余的写权限。

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 规范自检 + 单元测试 (py${{ matrix.python-version }})
    # 固定 ubuntu-22.04 而不是 ubuntu-latest：后者已升到 24.04，
    # setup-python 在上面拿不到旧版本 Python 的构建产物，会让矩阵随机挂掉。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # README、`SKILL.md` 的 compatibility 与 docs 都声明支持 **3.8+**，
        # 这里必须真去跑 3.8 —— 否则那句声明只是没人验证过的断言。
        # 3.9 与 3.12 分别代表中段与较新的稳定版。
        python-version: ["3.8", "3.9", "3.12"]
    steps:
      # actions/* 的大版本决定它跑在哪个 Node 运行时上。现用 v7 —— 由 dependabot 提 PR
      # （`ci: bump the actions-major group with 2 updates`）、经人工评估后合并。
      #
      # 为什么 v7 对本工作流是安全的：v7 的变更只有三项 —— 默认拒绝在
      # `pull_request_target` / `workflow_run` 触发时检出 fork 代码（本工作流不用这两个
      # 触发器）、迁到 ESM、依赖更新；setup-python 的 v7 移除了 `pip-install` 输入，
      # 而本工作流只用 `path` 与 `python-version` 这类最基础的输入。
      # 至于 checkout v6 的「凭据改存 `$RUNNER_TEMP` 下单独文件」：上游 README 明写
      # **No workflow changes required — `git fetch`, `git push`, etc. continue to work
      # automatically**，且本工作流只做检出与本地校验。
      #
      # 维护方式：一律钉到**完整 SHA**（并保留版本注释），由 `.github/dependabot.yml`
      # 每周提 PR 把 SHA 与注释里的版本号一起改掉。只钉 SHA 而不配 dependabot 反而更腐坏
      # —— 那样等于把「懒得更新」升级成「永远不更新」。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # 先落到中性目录，下面读出 frontmatter 的 `name` 后再改名为同名目录。
          path: _checkout

      # 技能规范要求 frontmatter 的 `name` 与「所在目录名」完全一致，而 Actions 的
      # 检出目录固定是仓库名（smart-buy-research，**没有版本后缀**）—— 直接在检出目录
      # 里跑校验必然报「name 与目录名不一致」。这是环境差异，不是内容问题，
      # 所以先把检出内容搬进以 `name` 命名的目录，后续步骤一律在那里执行。
      # 同样的坑对直接 `git clone` 的人也成立，见 docs/publishing.md。
      - name: 按 SKILL.md 的 name 建立同名目录
        id: layout
        run: |
          set -eu
          name="$(python - <<'PY'
          import pathlib
          import re

          front = pathlib.Path("_checkout/SKILL.md").read_text(encoding="utf-8").split("---", 2)[1]
          match = re.search(r"^name:[ \t]*([a-z0-9-]+)[ \t]*$", front, re.M)
          if not match:
              raise SystemExit("SKILL.md 的 frontmatter 里读不到 name")
          print(match.group(1))
          PY
          )"
          mv _checkout "$name"
          echo "skill_dir=$name" >> "$GITHUB_OUTPUT"
          echo "技能目录：$name"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: 显示环境
        working-directory: ${{ steps.layout.outputs.skill_dir }}
        run: python -VV

      - name: 技能结构规范自检
        working-directory: ${{ steps.layout.outputs.skill_dir }}
        run: python tools/validate_skill.py . --quiet

      - name: 脚本语法检查
        working-directory: ${{ steps.layout.outputs.skill_dir }}
        run: python -m compileall -q scripts tools

      - name: 单元测试
        working-directory: ${{ steps.layout.outputs.skill_dir }}
        run: python -m unittest discover -s tests -v
